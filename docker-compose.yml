
services:
  # Agent API Service (LITE MODE)
  agent-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: agent-api
    ports:
      - "8000:8000"
    environment:
      - LITE_MODE=true
      - LLM_MODEL=orca-mini
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - devops-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  devops-net:
    driver: bridge
